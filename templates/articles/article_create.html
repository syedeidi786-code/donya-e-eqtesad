{% extends "base.html" %}

{% block title %}
Create Article
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">
Publish Article
</h2>

<form method="post" enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-success">
Publish
</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
