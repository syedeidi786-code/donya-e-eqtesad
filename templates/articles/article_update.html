{% extends "base.html" %}

{% block title %}
Edit Article | Donya-e-Eqtesad
{% endblock %}

{% block content %}

<div class="edit-article-page">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="edit-article-card">

                    <!-- Header -->

                    <div class="edit-article-header">

                        <p class="edit-label">
                            EDITORIAL DESK
                        </p>

                        <h2>
                            Edit Article
                        </h2>

                        <p>
                            Refine your story before it reaches the world.
                        </p>

                    </div>


                    <!-- Form -->

                    <div class="edit-article-body">

                        <form method="post" enctype="multipart/form-data">

                            {% csrf_token %}

                            {{ form.as_p }}


                            <div class="edit-actions">

                                <button type="submit" class="update-btn">
                                    Update Article
                                </button>

                                <a href="{% url 'dashboard' %}" class="edit-cancel-btn">
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
