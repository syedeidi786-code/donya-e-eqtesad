{% extends "base.html" %}

{% block title %}
Delete Article | Donya-e-Eqtesad
{% endblock %}

{% block content %}

<div class="delete-article-page">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <div class="delete-card">

                    <div class="delete-icon">
                        !
                    </div>

                    <p class="delete-label">
                        EDITORIAL DESK
                    </p>

                    <h2>
                        Delete Article
                    </h2>

                    <div class="delete-divider"></div>

                    <p class="delete-message">
                        Are you sure you want to permanently delete
                    </p>

                    <h3 class="article-delete-title">
                        "{{ article.title }}"
                    </h3>

                    <p class="delete-warning">
                        This action cannot be undone.
                    </p>


                    <form method="post">

                        {% csrf_token %}

                        <div class="delete-actions">

                            <button type="submit" class="confirm-delete-btn">
                                Yes, Delete
                            </button>

                            <a href="{% url 'dashboard' %}" class="cancel-delete-btn">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
