{% extends "base.html" %}

{% block title %}
Delete Article
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-body text-center">

<h2 class="text-danger">
Delete Article
</h2>

<p class="mt-3">

Are you sure you want to delete

<strong>

{{ article.title }}

</strong>?

</p>

<form method="post">

{% csrf_token %}

<button class="btn btn-danger">
Yes, Delete
</button>

<a href="{% url 'dashboard' %}" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
