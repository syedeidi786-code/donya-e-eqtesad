{% extends "base.html" %}

{% block title %}
Create Account | Donya-e-Eqtesad
{% endblock %}

{% block content %}

<div class="luxury-auth-page">

    <div class="auth-card">

        <!-- HEADER -->

        <div class="auth-header">

            <div class="auth-kicker">
                DONYA-E-EQTESAD
            </div>

            <h1>
                Join Us
            </h1>

            <p>
                Become part of the conversation.
            </p>

        </div>


        <!-- FORM -->

        <div class="auth-body">

            <form method="post">

                {% csrf_token %}


                <div class="signup-form">

                    {{ form.as_p }}

                </div>


                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>

        </div>


        <!-- FOOTER -->

        <div class="auth-footer">

            <span>
                Already have an account?
            </span>

            <a href="{% url 'login' %}">
                Sign In
            </a>

        </div>

    </div>

</div>

{% endblock %}
